[package]
name = "stem-recorder-app"
version = "0.1.0"
description = "Stem Recorder demo app"
authors = ["PettHa"]
edition = "2021"

[lib]
name = "stem_recorder_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stem-recorder = { path = "../../../" }
