[package]
name = "stem-recorder"
version = "0.1.0"
authors = [ "PettHa" ]
description = "Tauri plugin recording microphone + system audio (loopback) to two separate WAV files."
repository = "https://github.com/PettHa/stem-recorder"
keywords = ["audio-recording", "loopback", "wasapi", "tauri", "tauri-plugin"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "stem-recorder"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
cpal = "0.15"
hound = "3.5"
chrono = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
